<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MD Brain</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #0d0b14;
      --bg-secondary: #161224;
      --bg-tertiary: #201a35;
      --border: #2e264a;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --text-primary: #ede9fe;
      --text-secondary: #a78bfa;
      --text-muted: #6b6387;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    #mobile-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 1400;
    }
    #mobile-backdrop.active {
      display: block;
    }

    #sidebar {
      width: 270px;
      min-width: 220px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), margin-left 0.25s ease;
      z-index: 1500;
    }
    #sidebar.hidden {
      margin-left: -270px;
    }

    .bar-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.5px;
      min-height: 48px;
    }
    .brand-title {
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.8px;
    }
    .btn-group {
      display: flex;
      gap: 4px;
    }
    .btn-group button, .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-primary);
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      min-height: 32px;
      transition: background 0.15s;
    }
    .btn-group button:hover, .icon-btn:hover {
      background: var(--accent);
    }

    #search-box {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    #search-box input {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
    }
    #search-box input:focus {
      border-color: var(--accent);
    }

    #folder-filter-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      color: var(--text-primary);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      user-select: none;
    }
    #folder-filter-badge.active {
      display: inline-flex;
    }
    .badge-clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0 2px;
    }
    .badge-clear-btn:hover {
      color: #ef4444;
    }

    #search-autocomplete {
      display: none;
      position: absolute;
      top: 100%;
      left: 10px;
      right: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      max-height: 240px;
      overflow-y: auto;
      z-index: 2200;
      margin-top: 4px;
      padding: 4px 0;
    }
    #search-autocomplete.active {
      display: block;
    }
    .autocomplete-item {
      padding: 7px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-primary);
      transition: background 0.12s ease;
    }
    .autocomplete-item:hover, .autocomplete-item.selected {
      background: var(--accent);
      color: #ffffff;
    }
    .autocomplete-badge {
      font-size: 0.68rem;
      color: var(--text-muted);
      background: var(--bg-main);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }
    .autocomplete-item:hover .autocomplete-badge,
    .autocomplete-item.selected .autocomplete-badge {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }
    .autocomplete-footer {
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      margin-top: 4px;
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      background: rgba(13, 11, 20, 0.4);
    }
    .autocomplete-key {
      padding: 1px 4px;
      font-size: 0.65rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-secondary);
    }

    #file-tree, #search-results {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      font-size: 0.9rem;
      -webkit-overflow-scrolling: touch;
    }
    .tree-node {
      padding: 7px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      user-select: none;
      min-height: 34px;
    }
    .tree-node:hover {
      background: var(--bg-tertiary);
    }
    .tree-node.active {
      background: var(--accent-glow);
      color: var(--accent);
      font-weight: bold;
    }
    .tree-node-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }
    .tree-folder {
      color: var(--text-secondary);
      font-weight: 500;
    }
    .folder-arrow {
      font-size: 0.7rem;
      color: var(--text-muted);
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .folder-arrow.collapsed {
      transform: rotate(-90deg);
    }
    .folder-children {
      margin-left: 14px;
      border-left: 1px solid var(--border);
      padding-left: 4px;
    }
    .folder-children.collapsed {
      display: none;
    }
    .tree-action-btn {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.75rem;
      line-height: 1;
      transition: opacity 0.15s, color 0.15s;
    }
    .tree-node:hover .tree-action-btn {
      opacity: 0.7;
    }
    .tree-action-btn:hover {
      opacity: 1 !important;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    /* Context Menu */
    #context-menu {
      display: none;
      position: fixed;
      z-index: 2500;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      min-width: 160px;
      padding: 4px 0;
      user-select: none;
    }
    .context-menu-item {
      padding: 8px 14px;
      font-size: 0.85rem;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .context-menu-item:hover {
      background: var(--accent);
      color: #ffffff;
    }
    .context-menu-item.danger:hover {
      background: #dc2626;
      color: #ffffff;
    }

    #main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }
    #editor-header {
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 48px;
    }
    #header-left-group {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    #note-name-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
      width: 100%;
      max-width: 480px;
      font-family: monospace;
    }
    #note-name-input:hover, #note-name-input:focus {
      border-color: var(--border);
      background: var(--bg-tertiary);
    }
    #title-tab-autocomplete {
      display: none;
      position: absolute;
      top: 100%;
      left: 36px;
      width: calc(100% - 36px);
      max-width: 480px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      max-height: 200px;
      overflow-y: auto;
      z-index: 2400;
      margin-top: 6px;
      padding: 4px 0;
    }
    #title-tab-autocomplete.active {
      display: block;
    }
    .title-tab-item {
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      font-family: monospace;
      transition: background 0.12s ease;
    }
    .title-tab-item:hover, .title-tab-item.selected {
      background: var(--accent);
      color: #ffffff;
    }
    .title-tab-footer {
      border-top: 1px solid var(--border);
      padding: 4px 10px;
      margin-top: 3px;
      font-size: 0.68rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      background: rgba(13, 11, 20, 0.5);
    }
    #save-status {
      font-size: 0.75rem;
      color: var(--accent);
      white-space: nowrap;
    }

    #mobile-view-tabs {
      display: none;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 4px 8px;
      gap: 6px;
      justify-content: center;
    }
    .view-tab-btn {
      flex: 1;
      max-width: 140px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .view-tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    #tag-bar {
      padding: 6px 14px;
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      background: rgba(22, 18, 36, 0.4);
      border-bottom: 1px solid var(--border);
      min-height: 36px;
      align-items: center;
    }
    .tag {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    #editor-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    #markdown-input {
      width: 50%;
      height: 100%;
      background: transparent;
      color: var(--text-primary);
      border: none;
      outline: none;
      padding: 16px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      overflow-y: auto;
    }
    #resizer {
      width: 5px;
      background: var(--border);
      cursor: col-resize;
    }
    #resizer:hover {
      background: var(--accent);
    }
    #preview {
      flex: 1;
      height: 100%;
      padding: 16px;
      overflow-y: auto;
      line-height: 1.6;
    }
    #preview a {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Task & List Items */
    #preview ul, #preview ol {
      padding-left: 24px;
      margin: 8px 0;
    }
    #preview li {
      margin: 4px 0;
      line-height: 1.5;
    }
    #preview li.task-list-item {
      list-style-type: none;
      margin-left: -20px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    #preview input[type="checkbox"].task-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-tertiary) !important;
      cursor: pointer !important;
      pointer-events: auto !important;
      position: relative;
      top: 3px;
      margin: 0;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }
    #preview input[type="checkbox"].task-checkbox:hover {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.15) !important;
    }
    #preview input[type="checkbox"].task-checkbox:checked {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
    }
    #preview input[type="checkbox"].task-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 4px;
      height: 8px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    #preview li.task-list-item.is-done > span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    #related-panel {
      width: 290px;
      min-width: 220px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-right 0.25s ease;
      z-index: 1500;
    }
    #related-panel.hidden {
      margin-right: -290px;
    }
    #backlinks-list, #related-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .backlink-item, .related-item, .search-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .backlink-item:hover, .related-item:hover, .search-card:hover {
      border-color: var(--accent);
    }
    .canonical-badge {
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    #graph-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13, 11, 20, 0.95);
      z-index: 2000;
      flex-direction: column;
    }
    #graph-modal.active {
      display: flex;
    }
    #graph-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 82%;
        margin-left: 0;
        transform: translateX(-100%);
      }
      #sidebar.mobile-open {
        transform: translateX(0);
      }
      #related-panel {
        position: fixed;
        top: 0;
        bottom: 0;
        right: 0;
        width: 82%;
        margin-right: 0;
        transform: translateX(100%);
      }
      #related-panel.mobile-open {
        transform: translateX(0);
      }
      #resizer {
        display: none;
      }
      #mobile-view-tabs {
        display: flex;
      }
      #editor-container {
        flex-direction: column;
      }
      #markdown-input {
        width: 100% !important;
      }
      body.view-edit #preview {
        display: none;
      }
      body.view-preview #markdown-input {
        display: none;
      }
    }
  </style>
</head>
<body class="view-edit">

  <div id="mobile-backdrop" onclick="closeAllDrawers()"></div>

  <aside id="sidebar">
    <div class="bar-header">
      <span class="brand-title">MD Brain</span>
      <div class="btn-group">
        <button onclick="openDailyNote()">📅 Today</button>
        <button onclick="createNewNote()">+ Note</button>
        <button onclick="toggleGraphView()">🌐</button>
      </div>
    </div>

    <div id="search-box">
      <div id="folder-filter-badge">
        <span id="folder-filter-text">📁 Folder</span>
        <button class="badge-clear-btn" onclick="clearFolderFilter()">✕</button>
      </div>
      <input type="text" id="search-input" placeholder="Search... (path: file: #tag)" autocomplete="off">
      <div id="search-autocomplete"></div>
    </div>

    <div id="search-results" style="display: none;"></div>
    <div id="file-tree"></div>
  </aside>

  <main id="main-panel">
    <div id="editor-header">
      <div id="header-left-group">
        <button class="icon-btn" onclick="toggleSidebar()">☰</button>
        <input type="text" 
               id="note-name-input" 
               placeholder="folder/filename" 
               autocomplete="off" 
               spellcheck="false" 
               onblur="handleNameChange(this.value)">
        <div id="title-tab-autocomplete"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="save-status">Ready</span>
        <button class="icon-btn" onclick="deleteCurrentNote()" title="Delete this note">🗑</button>
        <button class="icon-btn" onclick="toggleRelatedPanel()">▤</button>
      </div>
    </div>

    <div id="mobile-view-tabs">
      <button class="view-tab-btn active" id="tab-edit" onclick="setMobileView('edit')">✏️ Edit</button>
      <button class="view-tab-btn" id="tab-preview" onclick="setMobileView('preview')">👁 Preview</button>
    </div>

    <div id="tag-bar"></div>

    <div id="editor-container">
      <textarea id="markdown-input" placeholder="Start typing immediately... Your note will auto-save!"></textarea>
      <div id="resizer"></div>
      <div id="preview"></div>
    </div>
  </main>

  <aside id="related-panel" class="hidden">
    <div class="bar-header">
      <span>Backlinks</span>
      <button class="icon-btn" onclick="toggleRelatedPanel()">✕</button>
    </div>
    <div id="backlinks-list"></div>

    <div class="bar-header">Related Notes</div>
    <div id="related-list"></div>
  </aside>

  <!-- Right-Click Context Menu for Tree Items -->
  <div id="context-menu">
    <div class="context-menu-item" onclick="contextDelete()">🗑 Delete</div>
  </div>

  <div id="graph-modal">
    <div style="padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: flex-end;">
      <button class="icon-btn" onclick="toggleGraphView()">Close</button>
    </div>
    <div id="graph-viewport"></div>
  </div>

  <script>
    let currentCanonical = null;
    let saveTimer = null;
    let searchTimer = null;
    let cachedSuggestions = { folders: [], tags: [], files: [] };
    let selectedAutocompleteIndex = -1;
    let currentTokenMatch = null;
    let activeFolderFilter = null;
    let contextItem = null;

    const fileTree = document.getElementById("file-tree");
    const searchResults = document.getElementById("search-results");
    const searchInput = document.getElementById("search-input");
    const autocompleteMenu = document.getElementById("search-autocomplete");
    const titleTabMenu = document.getElementById("title-tab-autocomplete");
    const noteNameInput = document.getElementById("note-name-input");
    const markdownInput = document.getElementById("markdown-input");
    const previewPane = document.getElementById("preview");
    const mobileBackdrop = document.getElementById("mobile-backdrop");
    const contextMenu = document.getElementById("context-menu");

    function isMobile() { return window.innerWidth <= 768; }

    function toggleSidebar() {
      const sb = document.getElementById("sidebar");
      if (isMobile()) {
        const isOpen = sb.classList.toggle("mobile-open");
        mobileBackdrop.classList.toggle("active", isOpen);
      } else {
        sb.classList.toggle("hidden");
      }
    }

    function toggleRelatedPanel() {
      const rp = document.getElementById("related-panel");
      if (isMobile()) {
        const isOpen = rp.classList.toggle("mobile-open");
        mobileBackdrop.classList.toggle("active", isOpen);
      } else {
        rp.classList.toggle("hidden");
      }
    }

    function closeAllDrawers() {
      document.getElementById("sidebar").classList.remove("mobile-open");
      document.getElementById("related-panel").classList.remove("mobile-open");
      mobileBackdrop.classList.remove("active");
    }

    function setMobileView(mode) {
      document.body.classList.remove("view-edit", "view-preview");
      document.body.classList.add(`view-${mode}`);
      document.getElementById("tab-edit").classList.toggle("active", mode === "edit");
      document.getElementById("tab-preview").classList.toggle("active", mode === "preview");
    }

    async function loadTree() {
      const res = await fetch("/api/tree");
      const tree = await res.json();
      fileTree.innerHTML = renderTreeNodes(tree);
    }

    function renderTreeNodes(nodes) {
      let html = "";
      for (const node of nodes) {
        if (node.type === "folder") {
          html += `
            <div class="tree-node tree-folder" 
                 oncontextmenu="openContextMenu(event, '${node.canonical_name}', true)"
                 onclick="toggleFolderNode(this)">
              <div class="tree-node-left">
                <span class="folder-arrow">▼</span>
                <span>📁 ${node.name}</span>
              </div>
              <button class="tree-action-btn" onclick="event.stopPropagation(); deleteItem('${node.canonical_name}', true)">✕</button>
            </div>
            <div class="folder-children">
              ${renderTreeNodes(node.children)}
            </div>
          `;
        } else {
          const isActive = currentCanonical === node.canonical_name;
          html += `
            <div class="tree-node ${isActive ? 'active' : ''}" 
                 oncontextmenu="openContextMenu(event, '${node.canonical_name}', false)"
                 onclick="openNote('${node.canonical_name}')">
              <div class="tree-node-left">
                <span>📄 ${node.name}</span>
              </div>
              <button class="tree-action-btn" onclick="event.stopPropagation(); deleteItem('${node.canonical_name}', false)">✕</button>
            </div>
          `;
        }
      }
      return html;
    }

    function toggleFolderNode(elem) {
      const arrow = elem.querySelector(".folder-arrow");
      const children = elem.nextElementSibling;
      if (children && children.classList.contains("folder-children")) {
        children.classList.toggle("collapsed");
        arrow.classList.toggle("collapsed");
      }
    }

    // Context Menu for Right-Click Delete
    function openContextMenu(e, canonicalName, isFolder) {
      e.preventDefault();
      contextItem = { path: canonicalName, isFolder };
      contextMenu.style.display = "block";
      contextMenu.style.left = `${Math.min(e.clientX, window.innerWidth - 180)}px`;
      contextMenu.style.top = `${Math.min(e.clientY, window.innerHeight - 100)}px`;
    }

    window.addEventListener("click", () => {
      contextMenu.style.display = "none";
    });

    function contextDelete() {
      if (!contextItem) return;
      deleteItem(contextItem.path, contextItem.isFolder);
      contextMenu.style.display = "none";
    }

    async function deleteItem(canonicalName, isFolder) {
      const label = isFolder ? `folder '${canonicalName}' and all files inside` : `note '${canonicalName}'`;
      if (!confirm(`Are you sure you want to delete ${label}?`)) return;

      const res = await fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: canonicalName })
      });

      if (res.ok) {
        // Clear editor if the open note or its containing folder was deleted
        if (currentCanonical === canonicalName || (isFolder && currentCanonical && currentCanonical.startsWith(canonicalName + "/"))) {
          currentCanonical = null;
          noteNameInput.value = "";
          markdownInput.value = "";
          previewPane.innerHTML = "";
          document.getElementById("tag-bar").innerHTML = "";
          document.getElementById("backlinks-list").innerHTML = "";
          document.getElementById("related-list").innerHTML = "";
          document.getElementById("save-status").textContent = "Deleted";
        }
        await loadTree();
        loadSearchSuggestions();
      } else {
        alert("Failed to delete item.");
      }
    }

    function deleteCurrentNote() {
      if (!currentCanonical) return;
      deleteItem(currentCanonical, false);
    }

    async function openNote(canonicalName) {
      closeAllDrawers();
      const res = await fetch(`/api/note?path=${encodeURIComponent(canonicalName)}`);
      if (!res.ok) return;

      const data = await res.json();
      currentCanonical = data.canonical_name;
      noteNameInput.value = currentCanonical;
      markdownInput.value = data.content;

      renderTags(data.tags);
      updatePreview(data.content);
      loadBacklinks(currentCanonical);
      loadRelated(currentCanonical);
      loadTree();
    }

    async function createNewNote() {
      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: null, content: "" })
      });
      const data = await res.json();
      await loadTree();
      loadSearchSuggestions();
      await openNote(data.canonical_name);
      noteNameInput.focus();
      noteNameInput.select();
    }

    async function openDailyNote() {
      const res = await fetch("/api/daily-note", { method: "POST" });
      const data = await res.json();
      await loadTree();
      loadSearchSuggestions();
      await openNote(data.canonical_name);
    }

    async function handleNameChange(newName) {
      if (!currentCanonical) return;
      const cleanNew = newName.trim().replace(/^\/+/, "").replace(/\.md$/, "");
      if (!cleanNew || cleanNew === currentCanonical) {
        noteNameInput.value = currentCanonical;
        return;
      }

      document.getElementById("save-status").textContent = "Updating...";
      const res = await fetch("/api/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          old_path: currentCanonical,
          new_path: cleanNew,
          is_folder: false
        })
      });

      if (res.ok) {
        const data = await res.json();
        currentCanonical = data.new_canonical_name;
        noteNameInput.value = currentCanonical;
        document.getElementById("save-status").textContent = data.refactored_notes_count > 0 
          ? `Saved (${data.refactored_notes_count} links updated)` 
          : "Saved";

        await loadTree();
        loadSearchSuggestions();
        loadBacklinks(currentCanonical);
        loadRelated(currentCanonical);
      } else {
        const err = await res.json();
        alert(err.error || "Failed to rename note");
        noteNameInput.value = currentCanonical;
        document.getElementById("save-status").textContent = "Ready";
      }
    }

    function renderTags(tags) {
      document.getElementById("tag-bar").innerHTML = (tags || []).map(t => `<span class="tag">#${t}</span>`).join("");
    }

    function updatePreview(rawMarkdown) {
      let processed = rawMarkdown.replace(/\[\[(.*?)\]\]/g, (match, target) => {
        const parts = target.split("|");
        const linkTarget = parts[0].trim();
        const label = parts[1] ? parts[1].trim() : linkTarget;
        return `<a href="wikilink://${encodeURIComponent(linkTarget)}">${label}</a>`;
      });

      previewPane.innerHTML = marked.parse(processed);
      previewPane.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));

      let taskIndex = 0;
      previewPane.querySelectorAll("li").forEach(li => {
        const rawCheckbox = li.querySelector('input[type="checkbox"]');
        if (rawCheckbox) {
          li.classList.add("task-list-item");
          const isDone = rawCheckbox.checked;
          const currentIdx = taskIndex++;

          rawCheckbox.remove();

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.className = "task-checkbox";
          cb.checked = isDone;
          cb.disabled = false;
          cb.removeAttribute("disabled");

          cb.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleTaskByIndex(currentIdx, cb.checked);
          });

          const textWrapper = document.createElement("span");
          while (li.firstChild) {
            textWrapper.appendChild(li.firstChild);
          }

          if (isDone) li.classList.add("is-done");

          li.appendChild(cb);
          li.appendChild(textWrapper);
        }
      });
    }

    function toggleTaskByIndex(taskIdx, isChecked) {
      const lines = markdownInput.value.split("\n");
      const taskPattern = /^(\s*[-*+]\s+\[)[ xX](\]\s*.*)$/;
      let count = 0;

      for (let i = 0; i < lines.length; i++) {
        if (taskPattern.test(lines[i])) {
          if (count === taskIdx) {
            const match = lines[i].match(taskPattern);
            lines[i] = `${match[1]}${isChecked ? 'x' : ' '}${match[2]}`;
            break;
          }
          count++;
        }
      }

      markdownInput.value = lines.join("\n");
      updatePreview(markdownInput.value);

      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        await fetch("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: currentCanonical, content: markdownInput.value })
        });
      }, 300);
    }

    previewPane.addEventListener("click", async (e) => {
      const link = e.target.closest("a");
      if (!link) return;

      const href = link.getAttribute("href");
      if (!href) return;

      if (href.startsWith("wikilink://")) {
        e.preventDefault();
        const target = decodeURIComponent(href.replace("wikilink://", ""));
        const res = await fetch(`/api/resolve-link?target=${encodeURIComponent(target)}`);
        const info = await res.json();

        if (info.found) {
          openNote(info.canonical_name);
        } else {
          await fetch("/api/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              path: info.suggested_name,
              content: `# ${info.suggested_name}\n\n`,
              allow_overwrite: false
            })
          });
          await loadTree();
          loadSearchSuggestions();
          openNote(info.suggested_name);
        }
        return;
      }

      if (/^https?:\/\//i.test(href)) {
        e.preventDefault();
        window.open(href, "_blank", "noopener,noreferrer");
      }
    });

    markdownInput.addEventListener("input", (e) => {
      const content = e.target.value;
      updatePreview(content);

      const tags = (content.match(/(?:(?<=\s)|(?<=^))#([a-zA-Z0-9_\-\/]+)/g) || []).map(t => t.substring(1));
      renderTags([...new Set(tags)]);

      document.getElementById("save-status").textContent = "Typing...";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        document.getElementById("save-status").textContent = "Saving...";
        const res = await fetch("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: currentCanonical, content })
        });
        const data = await res.json();
        document.getElementById("save-status").textContent = "Saved";

        if (data.canonical_name && data.canonical_name !== currentCanonical) {
          currentCanonical = data.canonical_name;
          noteNameInput.value = currentCanonical;
          loadTree();
        }
      }, 500);
    });

    // Keyboard Shortcuts: Enter list continuation & Ctrl+Enter task toggle
    markdownInput.addEventListener("keydown", (e) => {
      const textarea = markdownInput;
      const text = textarea.value;
      const selStart = textarea.selectionStart;
      const selEnd = textarea.selectionEnd;
      const isCmdOrCtrl = e.ctrlKey || e.metaKey;

      if (isCmdOrCtrl && e.key === "Enter") {
        e.preventDefault();

        const startLinePos = text.lastIndexOf("\n", selStart - 1) + 1;
        let endLinePos = text.indexOf("\n", selEnd);
        if (endLinePos === -1) endLinePos = text.length;

        const lines = text.substring(startLinePos, endLinePos).split("\n");
        let cursorShift = 0;

        const modifiedLines = lines.map((line) => {
          const checkedMatch = line.match(/^(\s*[-*+]\s+\[)[xX](\]\s*.*)$/);
          if (checkedMatch) return `${checkedMatch[1]} ${checkedMatch[2]}`;

          const uncheckedMatch = line.match(/^(\s*[-*+]\s+\[) (\]\s*.*)$/);
          if (uncheckedMatch) return `${uncheckedMatch[1]}x${uncheckedMatch[2]}`;

          const plainListMatch = line.match(/^(\s*)(?:[-*+]|\d+\.)\s+(.*)$/);
          if (plainListMatch) {
            const newLine = `${plainListMatch[1]}- [ ] ${plainListMatch[2]}`;
            cursorShift += newLine.length - line.length;
            return newLine;
          }

          const normalTextMatch = line.match(/^(\s*)(.*)$/);
          if (normalTextMatch && normalTextMatch[2].trim().length > 0) {
            const newLine = `${normalTextMatch[1]}- [ ] ${normalTextMatch[2]}`;
            cursorShift += newLine.length - line.length;
            return newLine;
          }

          return line;
        });

        const replacement = modifiedLines.join("\n");
        textarea.value = text.substring(0, startLinePos) + replacement + text.substring(endLinePos);

        if (selStart === selEnd) {
          const newPos = Math.max(startLinePos, selStart + cursorShift);
          textarea.selectionStart = textarea.selectionEnd = newPos;
        } else {
          textarea.selectionStart = startLinePos;
          textarea.selectionEnd = startLinePos + replacement.length;
        }

        textarea.dispatchEvent(new Event("input", { bubbles: true }));
        return;
      }

      if (e.key === "Enter" && !isCmdOrCtrl && !e.shiftKey) {
        const lineStart = text.lastIndexOf("\n", selStart - 1) + 1;
        const lineEnd = text.indexOf("\n", selStart);
        const actualLineEnd = lineEnd === -1 ? text.length : lineEnd;
        const currentLine = text.substring(lineStart, actualLineEnd);

        const listMatch = currentLine.match(/^(\s*)(?:([-*+]\s+\[[ xX]\]\s+)|(\d+)\.\s+|([-*+]\s+))(.*)$/);
        if (listMatch) {
          e.preventDefault();
          const indent = listMatch[1];
          const taskPrefix = listMatch[2];
          const numPrefix = listMatch[3];
          const bulletPrefix = listMatch[4];
          const itemContent = listMatch[5];

          if (!itemContent.trim()) {
            const updated = text.substring(0, lineStart) + text.substring(actualLineEnd);
            textarea.value = updated;
            textarea.selectionStart = textarea.selectionEnd = lineStart;
            textarea.dispatchEvent(new Event("input", { bubbles: true }));
            return;
          }

          let nextPrefix = "";
          if (taskPrefix) {
            nextPrefix = `${indent}- [ ] `;
          } else if (numPrefix) {
            nextPrefix = `${indent}${parseInt(numPrefix, 10) + 1}. `;
          } else if (bulletPrefix) {
            nextPrefix = `${indent}${bulletPrefix}`;
          }

          const textBefore = text.substring(0, selStart);
          const textAfter = text.substring(selStart);
          const insertion = `\n${nextPrefix}`;

          textarea.value = textBefore + insertion + textAfter;
          const newCursorPos = selStart + insertion.length;
          textarea.selectionStart = textarea.selectionEnd = newCursorPos;
          textarea.dispatchEvent(new Event("input", { bubbles: true }));
          return;
        }
      }

      if (e.key === "Tab") {
        e.preventDefault();
        const startLinePos = text.lastIndexOf("\n", selStart - 1) + 1;
        let endLinePos = text.indexOf("\n", selEnd);
        if (endLinePos === -1) endLinePos = text.length;

        const lines = text.substring(startLinePos, endLinePos).split("\n");
        let modifiedLines = [];
        let lengthDelta = 0;

        if (e.shiftKey) {
          modifiedLines = lines.map((line) => {
            let removedCount = 0;
            let updated = line;
            if (updated.startsWith("  ")) {
              updated = updated.substring(2);
              removedCount = 2;
            } else if (updated.startsWith(" ")) {
              updated = updated.substring(1);
              removedCount = 1;
            }
            lengthDelta -= removedCount;
            return updated;
          });
        } else {
          modifiedLines = lines.map((line) => {
            lengthDelta += 2;
            let updated = "  " + line;
            const nestedNumMatch = updated.match(/^(\s+)(\d+)\.\s+(.*)$/);
            if (nestedNumMatch && lines.length === 1) {
              updated = `${nestedNumMatch[1]}1. ${nestedNumMatch[3]}`;
              lengthDelta += (updated.length - line.length - 2);
            }
            return updated;
          });
        }

        const newBlock = modifiedLines.join("\n");
        textarea.value = text.substring(0, startLinePos) + newBlock + text.substring(endLinePos);

        if (selStart === selEnd) {
          const newCursor = Math.max(startLinePos, selStart + (e.shiftKey ? -2 : 2));
          textarea.selectionStart = textarea.selectionEnd = newCursor;
        } else {
          textarea.selectionStart = startLinePos;
          textarea.selectionEnd = endLinePos + lengthDelta;
        }
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
      }
    });

    async function loadSearchSuggestions() {
      try {
        const res = await fetch("/api/search-suggestions");
        if (res.ok) cachedSuggestions = await res.json();
      } catch (e) {}
    }

    function triggerSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = searchInput.value.trim();
        const folder = activeFolderFilter || "";

        if (!q && !folder) {
          searchResults.style.display = "none";
          fileTree.style.display = "block";
          return;
        }

        const params = new URLSearchParams({ q, folder });
        const res = await fetch(`/api/search?${params.toString()}`);
        const items = await res.json();

        fileTree.style.display = "none";
        searchResults.style.display = "block";

        if (items.length === 0) {
          searchResults.innerHTML = `<span style="font-size:0.8rem; color:var(--text-muted); padding:6px;">No matches found</span>`;
          return;
        }

        searchResults.innerHTML = items.map(item => `
          <div class="search-card" onclick="openNote('${item.canonical_name}')">
            <div class="canonical-badge">${item.canonical_name}</div>
            <div class="search-card-snippet" style="margin-top:4px;">${item.snippet}</div>
          </div>
        `).join("");
      }, 250);
    }

    function renderAutocomplete() {
      const val = searchInput.value;
      const cursor = searchInput.selectionStart;
      const textBeforeCursor = val.substring(0, cursor);
      const match = textBeforeCursor.match(/(?:^|\s)(path:|folder:|file:|title:|tag:|#)([^\s]*)$/i);

      if (!match) {
        autocompleteMenu.classList.remove("active");
        return;
      }

      const prefix = match[1];
      const q = match[2].toLowerCase();
      let matches = [];

      if (/^(path|folder):/i.test(prefix)) {
        matches = (cachedSuggestions.folders || [])
          .filter(f => f.name.toLowerCase().includes(q))
          .map(f => ({ label: f.name, count: f.count, insert: `${prefix}${f.name} ` }));
      } else if (/^(file|title):/i.test(prefix)) {
        matches = (cachedSuggestions.files || [])
          .filter(f => f.toLowerCase().includes(q))
          .map(f => ({ label: f, count: null, insert: `${prefix}${f} ` }));
      } else if (/^(tag:|#)/i.test(prefix)) {
        const cleanQ = q.replace(/^#/, "");
        matches = (cachedSuggestions.tags || [])
          .filter(t => t.name.toLowerCase().includes(cleanQ))
          .map(t => ({ label: `#${t.name}`, count: t.count, insert: prefix === "#" ? `#${t.name} ` : `tag:${t.name} ` }));
      }

      if (matches.length === 0) {
        autocompleteMenu.classList.remove("active");
        return;
      }

      autocompleteMenu.innerHTML = matches.slice(0, 8).map(m => `
        <div class="autocomplete-item" onmousedown="insertToken('${m.insert}', ${match.index + (match[0].startsWith(' ') ? 1 : 0)}, ${cursor})">
          <span>${m.label} ${m.count !== null ? `<span class="autocomplete-badge">${m.count}</span>` : ''}</span>
        </div>
      `).join("");
      autocompleteMenu.classList.add("active");
    }

    function insertToken(text, start, end) {
      const full = searchInput.value;
      searchInput.value = full.substring(0, start) + text + full.substring(end);
      autocompleteMenu.classList.remove("active");
      triggerSearch();
      searchInput.focus();
    }

    searchInput.addEventListener("input", () => {
      renderAutocomplete();
      triggerSearch();
    });
    searchInput.addEventListener("blur", () => setTimeout(() => autocompleteMenu.classList.remove("active"), 200));

    function clearFolderFilter() {
      activeFolderFilter = null;
      document.getElementById("folder-filter-badge").classList.remove("active");
      triggerSearch();
    }

    // Title Bar Path Tab Completion
    let tabCompletionState = {
      active: false,
      candidates: [],
      candidateIndex: -1,
      restSuffix: ""
    };

    function hideTitleTabMenu() {
      tabCompletionState.active = false;
      tabCompletionState.candidates = [];
      tabCompletionState.candidateIndex = -1;
      tabCompletionState.restSuffix = "";
      titleTabMenu.classList.remove("active");
      titleTabMenu.innerHTML = "";
    }

    function renderTitleTabMenu() {
      if (!tabCompletionState.active || tabCompletionState.candidates.length === 0) {
        hideTitleTabMenu();
        return;
      }

      const itemsHtml = tabCompletionState.candidates.map((c, idx) => `
        <div class="title-tab-item ${idx === tabCompletionState.candidateIndex ? 'selected' : ''}" data-idx="${idx}">
          <span>📁 ${c}/</span>
        </div>
      `).join("");

      const footerHtml = `
        <div class="title-tab-footer">
          <span><span class="autocomplete-key">Tab</span> or <span class="autocomplete-key">↑/↓</span> cycle</span>
          <span><span class="autocomplete-key">↵</span> select</span>
          <span><span class="autocomplete-key">Esc</span> cancel</span>
        </div>
      `;

      titleTabMenu.innerHTML = itemsHtml + footerHtml;

      titleTabMenu.querySelectorAll(".title-tab-item").forEach((item, idx) => {
        item.addEventListener("mousedown", (e) => {
          e.preventDefault();
          selectTitleCandidate(idx);
        });
      });

      titleTabMenu.classList.add("active");

      const selectedElem = titleTabMenu.querySelector(".title-tab-item.selected");
      if (selectedElem) selectedElem.scrollIntoView({ block: "nearest" });
    }

    function selectTitleCandidate(idx) {
      if (idx < 0 || idx >= tabCompletionState.candidates.length) return;
      const chosen = tabCompletionState.candidates[idx];
      const completed = chosen + "/";
      const rest = tabCompletionState.restSuffix || "";

      noteNameInput.value = completed + rest;
      noteNameInput.selectionStart = noteNameInput.selectionEnd = completed.length;
      hideTitleTabMenu();
      noteNameInput.focus();
    }

    noteNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        if (tabCompletionState.active && tabCompletionState.candidateIndex >= 0) {
          e.preventDefault();
          selectTitleCandidate(tabCompletionState.candidateIndex);
          return;
        }
        e.preventDefault();
        hideTitleTabMenu();
        noteNameInput.blur();
        return;
      }

      if (e.key === "Escape") {
        if (tabCompletionState.active) {
          e.preventDefault();
          hideTitleTabMenu();
        }
        return;
      }

      if (tabCompletionState.active) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          tabCompletionState.candidateIndex = (tabCompletionState.candidateIndex + 1) % tabCompletionState.candidates.length;
          const chosen = tabCompletionState.candidates[tabCompletionState.candidateIndex];
          noteNameInput.value = chosen + "/" + tabCompletionState.restSuffix;
          noteNameInput.selectionStart = noteNameInput.selectionEnd = (chosen + "/").length;
          renderTitleTabMenu();
          return;
        }
        if (e.key === "ArrowUp") {
          e.preventDefault();
          tabCompletionState.candidateIndex = (tabCompletionState.candidateIndex - 1 + tabCompletionState.candidates.length) % tabCompletionState.candidates.length;
          const chosen = tabCompletionState.candidates[tabCompletionState.candidateIndex];
          noteNameInput.value = chosen + "/" + tabCompletionState.restSuffix;
          noteNameInput.selectionStart = noteNameInput.selectionEnd = (chosen + "/").length;
          renderTitleTabMenu();
          return;
        }
      }

      if (e.key !== "Tab") {
        hideTitleTabMenu();
        return;
      }

      e.preventDefault();

      const inputVal = noteNameInput.value;
      const cursor = noteNameInput.selectionStart;
      const knownFolders = (cachedSuggestions.folders || []).map(f => f.name.replace(/\\/g, "/"));

      if (tabCompletionState.active && tabCompletionState.candidates.length > 0) {
        tabCompletionState.candidateIndex = (tabCompletionState.candidateIndex + 1) % tabCompletionState.candidates.length;
        const chosen = tabCompletionState.candidates[tabCompletionState.candidateIndex];
        noteNameInput.value = chosen + "/" + tabCompletionState.restSuffix;
        noteNameInput.selectionStart = noteNameInput.selectionEnd = (chosen + "/").length;
        renderTitleTabMenu();
        return;
      }

      const textToCursor = inputVal.substring(0, cursor);
      const restSuffix = inputVal.substring(cursor);
      const lastSlashIdx = textToCursor.lastIndexOf("/");
      const currentParent = lastSlashIdx !== -1 ? textToCursor.substring(0, lastSlashIdx) : "";
      const currentPartial = lastSlashIdx !== -1 ? textToCursor.substring(lastSlashIdx + 1) : textToCursor;

      let matches = [];
      if (currentParent === "") {
        matches = knownFolders.filter(f => {
          const topSegment = f.split("/")[0];
          return topSegment.toLowerCase().startsWith(currentPartial.toLowerCase());
        }).map(f => f.split("/")[0]);
      } else {
        const pfx = currentParent.toLowerCase() + "/";
        matches = knownFolders.filter(f => f.toLowerCase().startsWith(pfx)).map(f => {
          const sub = f.substring(currentParent.length + 1);
          return `${currentParent}/${sub.split("/")[0]}`;
        });
      }

      matches = [...new Set(matches)];

      if (matches.length === 0) {
        hideTitleTabMenu();
        return;
      }

      if (matches.length === 1) {
        const completed = matches[0] + "/";
        noteNameInput.value = completed + restSuffix;
        noteNameInput.selectionStart = noteNameInput.selectionEnd = completed.length;
        hideTitleTabMenu();
        return;
      }

      const findCommonPrefix = (arr) => {
        if (!arr.length) return "";
        let prefix = arr[0];
        for (let i = 1; i < arr.length; i++) {
          while (arr[i].indexOf(prefix) !== 0) {
            prefix = prefix.substring(0, prefix.length - 1);
            if (!prefix) return "";
          }
        }
        return prefix;
      };

      const common = findCommonPrefix(matches);
      if (common.length > textToCursor.length) {
        noteNameInput.value = common + restSuffix;
        noteNameInput.selectionStart = noteNameInput.selectionEnd = common.length;
      }

      tabCompletionState = {
        active: true,
        candidates: matches,
        candidateIndex: 0,
        restSuffix: restSuffix
      };

      renderTitleTabMenu();
    });

    window.addEventListener("click", (e) => {
      if (!e.target.closest("#header-left-group")) {
        hideTitleTabMenu();
      }
    });

    function toggleGraphView() {
      const modal = document.getElementById("graph-modal");
      modal.classList.toggle("active");
      if (modal.classList.contains("active")) renderGraph();
    }

    async function renderGraph() {
      const container = document.getElementById("graph-viewport");
      container.innerHTML = "";
      const width = container.clientWidth || window.innerWidth;
      const height = container.clientHeight || window.innerHeight;

      const res = await fetch("/api/graph");
      const data = await res.json();

      const svg = d3.select(container).append("svg").attr("width", width).attr("height", height);
      const g = svg.append("g");

      svg.call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

      const sim = d3.forceSimulation(data.nodes)
        .force("link", d3.forceLink(data.links).id(d => d.id).distance(90))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2));

      const link = g.append("g").selectAll("line").data(data.links).join("line").attr("stroke", "#8b5cf6").attr("stroke-width", 1.5);
      const node = g.append("g").selectAll("circle").data(data.nodes).join("circle").attr("r", 7).attr("fill", "#c084fc").call(
        d3.drag()
          .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
      ).on("click", (e, d) => {
        toggleGraphView();
        openNote(d.id);
      });

      const label = g.append("g").selectAll("text").data(data.nodes).join("text").text(d => d.title).attr("font-size", "10px").attr("fill", "#ede9fe").attr("dx", 10).attr("dy", 3);

      sim.on("tick", () => {
        link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("cx", d => d.x).attr("cy", d => d.y);
        label.attr("x", d => d.x).attr("y", d => d.y);
      });
    }

    loadTree();
    loadSearchSuggestions();
  </script>
</body>
</html>
